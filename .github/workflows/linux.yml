name: Linux
on:
  push:
    paths: ['linux/**', 'Compositor/Rendering/**', 'pyproject.toml', 'setup.py', 'MANIFEST.in', 'packaging/**', 'scripts/linux-*', 'scripts/arch-*', '.github/workflows/linux.yml']
  pull_request:
    paths: ['linux/**', 'Compositor/Rendering/**', 'pyproject.toml', 'setup.py', 'MANIFEST.in', 'packaging/**', 'scripts/linux-*', 'scripts/arch-*', '.github/workflows/linux.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QPA_PLATFORMTHEME: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libopengl0 desktop-file-utils
      - run: python -m pip install -e '.[test]' build
      - run: ruff check linux scripts/linux-desktop.py scripts/linux-compare.py setup.py
      - run: ruff format --check linux scripts/linux-desktop.py scripts/linux-compare.py setup.py
      - run: python -m pytest -q
      - run: desktop-file-validate packaging/linux/compositor.desktop
      - run: python -m build
