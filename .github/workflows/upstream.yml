name: Upstream releases
on:
  schedule:
    - cron: '23 14 * * *'
  workflow_dispatch:
  push:
    paths: ['docs/upstream.json', 'scripts/upstream-*.py', 'linux/tests/test_upstream.py', '.github/workflows/upstream.yml']
  pull_request:
    paths: ['docs/upstream.json', 'scripts/upstream-*.py', 'linux/tests/test_upstream.py', '.github/workflows/upstream.yml']
permissions:
  contents: read
concurrency:
  group: upstream-${{ github.ref }}
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Inspect latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/upstream-check.py --output "$RUNNER_TEMP/upstream-report"
          cat "$RUNNER_TEMP/upstream-report/report.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: artifact
        with:
          name: upstream-report
          path: ${{ runner.temp }}/upstream-report/
          retention-days: 30
  tracking-issue:
    needs: report
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.report.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/upstream-report/
      - name: Update the single tracking issue when content changes
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_REPOSITORY: ${{ github.repository }}
        run: python scripts/upstream-check.py --publish-report "$RUNNER_TEMP/upstream-report/report.md" --publish-issue "$FORK_REPOSITORY"
